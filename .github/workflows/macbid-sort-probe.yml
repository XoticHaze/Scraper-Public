name: MAC.BID Sort Probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/macbid_sort_probe.py'
      - '.github/workflows/macbid-sort-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install browser
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Probe sort behavior
        run: |
          set -euo pipefail
          python scripts/macbid_sort_probe.py
