name: MAC.BID Deal Engine
run-name: MAC.BID Hunt · ${{ github.event_name }} · #${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Optional reason for this refresh
        required: false
        type: string
  repository_dispatch:
    types: [refresh]
  workflow_run:
    workflows: ['Scraper Public CI']
    types: [completed]
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: macbid-live-refresh
  cancel-in-progress: true

jobs:
  engine:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - name: Describe refresh trigger
        run: |
          echo "event=${{ github.event_name }}"
          echo "actor=${{ github.actor }}"
          echo "ref=${{ github.ref }}"
          echo "dispatch_reason=${{ github.event.inputs.reason || github.event.client_payload.reason || 'n/a' }}"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install fixed dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'playwright==1.55.0' 'pytest==8.4.1'
          python -m playwright install --with-deps chromium

      - name: Run scoring tests
        run: |
          set -euo pipefail
          pytest -q tests/test_deal_scoring.py

      - name: Run San Antonio inventory deal engine
        run: |
          set -euo pipefail
          python scripts/macbid_deal_engine.py

      - name: Collapse duplicate products and build verification queue
        run: |
          set -euo pipefail
          python scripts/macbid_postprocess.py

      - name: Build static hunt UI
        run: |
          set -euo pipefail
          node --check ui/app.js
          node --check ui/app-enhancements.js
          node --check ui/catalog-loader.js
          python scripts/macbid_build_ui.py
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('site/catalog.json').read_text())
          assert data['locations'] == ['San Antonio'], data['locations']
          assert data['product_count'] > 0
          assert data['lot_count'] > 0
          assert Path('site/catalog.js').exists()
          assert Path('site/app-enhancements.js').exists()
          assert Path('site/enhancements.css').exists()
          assert all(
              lot.get('auction_location') == 'San Antonio'
              for product in data['products']
              for lot in product['lots']
          )
          assert any(
              lot.get('image_url') or product.get('image_url')
              for product in data['products'][:500]
              for lot in product['lots'][:1]
          )
          print(f"UI_CATALOG_SAN_ANTONIO products={data['product_count']} lots={data['lot_count']}")
          PY

      - name: Smoke-test directly opened hunt UI
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          url = Path('site/index.html').resolve().as_uri()
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)

              desktop = browser.new_page(viewport={"width": 1440, "height": 1100})
              desktop.goto(url, wait_until='domcontentloaded', timeout=30000)
              desktop.wait_for_selector('.card', timeout=30000)
              desktop.wait_for_selector('.app-status', timeout=30000)
              assert desktop.locator('.card').count() > 0
              assert desktop.locator('.card img[src]').count() > 0
              assert desktop.locator('.quick-chip').count() >= 6
              assert desktop.locator('#snapshot-health').inner_text()
              assert 'products' in desktop.locator('#catalog-meta').inner_text().lower()
              desktop.fill('#search', 'a')
              desktop.wait_for_timeout(100)
              assert int(desktop.locator('#result-count').inner_text().replace(',', '')) >= 0
              desktop.close()

              mobile = browser.new_page(viewport={"width": 390, "height": 844}, is_mobile=True)
              mobile.goto(url, wait_until='domcontentloaded', timeout=30000)
              mobile.wait_for_selector('.card', timeout=30000)
              mobile.wait_for_selector('.app-status', timeout=30000)
              top_links = mobile.locator('.top-actions a')
              assert top_links.count() >= 3
              for idx in range(top_links.count()):
                  assert top_links.nth(idx).is_visible(), f'top action {idx} hidden on mobile'
              close_metric = mobile.locator('.card').first.locator('.metric').nth(3)
              assert close_metric.is_visible(), 'close time hidden on mobile'
              assert close_metric.inner_text().strip()
              assert mobile.evaluate('document.body.scrollWidth') <= 390
              print('UI_DIRECT_OPEN_SMOKE=PASS desktop+mobile')
              mobile.close()
              browser.close()
          PY

      - name: Show compact ranked summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f results/macbid-deal-engine.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('results/macbid-deal-engine.json').read_text())
          print(json.dumps(data.get('scan', {}), indent=2, sort_keys=True))
          for view, rows in data.get('views', {}).items():
              print(f'===== {view} =====')
              for row in rows[:25]:
                  print(json.dumps({
                      'product_name': row.get('product_name') or row.get('title') or row.get('name'),
                      'auction_location': row.get('auction_location'),
                      'condition': row.get('condition'),
                      'current_bid': row.get('current_bid'),
                      'retail_price': row.get('retail_price'),
                      'estimated_pre_tax_total': row.get('estimated_pre_tax_total'),
                      'deal_score': row.get('deal_score'),
                      'expected_closing_utc': row.get('expected_closing_utc'),
                      'unique_bidders': row.get('unique_bidders'),
                      'duplicate_lot_count': row.get('duplicate_lot_count'),
                      'market_price_status': row.get('market_price_status'),
                      'macbid_url': row.get('macbid_url'),
                  }, sort_keys=True))
          PY
          else
            echo 'No deal-engine report was produced.'
          fi

      - name: Upload deal engine report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macbid-deal-engine
          path: results/macbid-deal-engine.json
          if-no-files-found: warn
          retention-days: 2

      - name: Upload browsable UI artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macbid-hunt-ui
          path: site
          if-no-files-found: error
          retention-days: 2

      - name: Upload GitHub Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site

  deploy-pages:
    if: ${{ needs.engine.result == 'success' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main') }}
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy MAC.BID Hunt to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
