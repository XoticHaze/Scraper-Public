name: Encrypted Private Compute
run-name: Private compute · ${{ inputs.workload_id || 'request-marker' }} · #${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      contract_id:
        description: Fixed public execution contract
        required: true
        type: choice
        default: python-bundle-v1
        options:
          - python-bundle-v1
      workload_id:
        description: Private workload ID resolved by the trusted producer
        required: true
        type: string
        default: producer-selftest-v1
  push:
    paths:
      - 'rendezvous/requests/private-compute-*.json'

permissions:
  contents: read

concurrency:
  group: encrypted-private-compute-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  resolve-request:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      contract_id: ${{ steps.resolve.outputs.contract_id }}
      workload_id: ${{ steps.resolve.outputs.workload_id }}
      request_source: ${{ steps.resolve.outputs.request_source }}
    steps:
      - name: Checkout request metadata only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Resolve request
        id: resolve
        env:
          INPUT_CONTRACT_ID: ${{ inputs.contract_id || '' }}
          INPUT_WORKLOAD_ID: ${{ inputs.workload_id || '' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          contract = (os.environ.get('INPUT_CONTRACT_ID') or 'python-bundle-v1').strip()
          workload = (os.environ.get('INPUT_WORKLOAD_ID') or '').strip()
          source = 'workflow_dispatch'
          if os.environ.get('GITHUB_EVENT_NAME') == 'push':
              changed = subprocess.check_output(
                  ['git', 'diff-tree', '--no-commit-id', '--name-only', '-r', 'HEAD'], text=True
              ).splitlines()
              candidates = [p for p in changed if p.startswith('rendezvous/requests/private-compute-') and p.endswith('.json')]
              if len(candidates) != 1:
                  raise SystemExit(f'expected exactly one private-compute request marker, got {candidates}')
              marker = Path(candidates[0])
              doc = json.loads(marker.read_text(encoding='utf-8'))
              workload = str(doc.get('workload_id') or '').strip()
              contract = str(doc.get('contract_id') or contract).strip()
              source = marker.as_posix()
          ident = re.compile(r'^[a-z0-9][a-z0-9._-]{0,63}$')
          if not ident.fullmatch(contract) or not ident.fullmatch(workload):
              raise SystemExit('invalid contract_id/workload_id')
          out = Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a', encoding='utf-8') as f:
              f.write(f'contract_id={contract}\n')
              f.write(f'workload_id={workload}\n')
              f.write(f'request_source={source}\n')
          print(f'PRIVATE_COMPUTE_RESOLVED workload={workload} contract={contract} source={source}')
          PY

  pinned-runtime:
    needs: resolve-request
    permissions:
      contents: write
    uses: XoticHaze/Scraper-Public/.github/workflows/encrypted-private-compute-runtime.yml@646afc3a233f8a9739b252925d94592b30fea470
    with:
      contract_id: ${{ needs.resolve-request.outputs.contract_id }}
      workload_id: ${{ needs.resolve-request.outputs.workload_id }}
      request_source: ${{ needs.resolve-request.outputs.request_source }}
