name: Last Chance public discovery probe
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/last-chance-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install playwright==1.55.0
          python -m playwright install chromium
      - name: Fetch native San Antonio inventory and verify completeness
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from collections import Counter
          from urllib.parse import urlsplit, parse_qs, urlencode, urlunsplit
          import re
          from playwright.sync_api import sync_playwright
          base='https://api.macdiscount.com'
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              context=browser.new_context(locale='en-US',timezone_id='America/Chicago')
              page=context.new_page()
              native=[]
              def on_response(r):
                  if r.url.startswith(base+'/map-bid/last-chance-deals/search?'):
                      native.append(r.url)
              page.on('response',on_response)
              def select_building(route):
                  u=urlsplit(route.request.url)
                  q=parse_qs(u.query)
                  q['buildings']=['29']
                  route.continue_(url=urlunsplit((u.scheme,u.netloc,u.path,urlencode(q,doseq=True),u.fragment)))
              page.route('**/map-bid/last-chance-deals/search?*',select_building)
              page.goto('https://www.mac.bid/last-chance-deals',wait_until='domcontentloaded',timeout=30000)
              page.wait_for_timeout(5000)
              for label in ['Got it','I understand']:
                  b=page.get_by_role('button',name=label,exact=True)
                  if b.count():
                      try:b.first.click(timeout=3000)
                      except Exception:pass
              page.wait_for_timeout(5000)
              print('AFTER_DISMISS',page.locator('body').inner_text()[:1800])
              print('VISIBLE_LINKS',json.dumps([{'text':a.inner_text()[:100],'href':a.get_attribute('href')} for a in page.locator('a:visible').all()[:30]]))
              def get(path):
                  r=context.request.get(base+path,headers={'Origin':'https://www.mac.bid','Referer':'https://www.mac.bid/'},timeout=30000)
                  print('HTTP',path,r.status)
                  r.raise_for_status() if hasattr(r,'raise_for_status') else None
                  assert r.ok, r.status
                  return r.json()
              buildings=get('/buildings')
              target=[b for b in buildings if b.get('name')=='San Antonio']
              assert len(target)==1 and target[0]['id']==29,target
              data=get('/map-bid/last-chance-deals/search?buildings=29&limit=2000')
              rows=data['items']
              assert isinstance(rows,list)
              now=datetime.now(timezone.utc)
              keys=('id','lot_id','auction_id','inventory_id','lot_number','product_name','stock_image','inventory_images','retail_price','building_id','is_partial','condition','category','price','expires_at','is_sold')
              clean=[{k:r[k] for k in keys if k in r} for r in rows]
              assert all(r.get('building_id')==29 for r in clean)
              assert len({str(r.get('lot_id')) for r in clean})==len(clean)
              complete=data.get('has_more') is False and data.get('count')==len(clean)
              active=[]
              for r in clean:
                  try:
                      expires=datetime.fromisoformat(r['expires_at'].replace('Z','+00:00'))
                      interpretations=[expires] if expires.tzinfo else [expires.replace(tzinfo=timezone.utc),expires.replace(tzinfo=ZoneInfo('America/Chicago'))]
                      future=[x>now for x in interpretations]
                      state='unexpired' if all(future) else 'expired' if not any(future) else 'timezone_uncertain'
                  except (KeyError,ValueError,TypeError,AttributeError):
                      state='invalid_expiry'
                  r['expiry_status']=state
                  if r.get('is_sold')==0 and float(r.get('price',0))==2.99 and state=='unexpired':active.append(r)
              summary={'observed_at':now.isoformat(),'warehouse':'San Antonio','building_id':29,'reported_count':data.get('count'),'received':len(clean),'has_more':data.get('has_more'),'complete':complete,'active':len(active),'expiry_status_counts':dict(Counter(r['expiry_status'] for r in clean)),'expiry_policy':'Conservative: naive values must be future under UTC and America/Chicago; source timezone not established','native_page_observed':bool(native)}
              print('INVENTORY_SUMMARY',json.dumps(summary))
              for r in active:
                  compact={k:v for k,v in r.items() if k not in ('stock_image','inventory_images','inventory_id','id')}
                  print('LOT',json.dumps(compact,ensure_ascii=True,separators=(',',':')))
              Path('last-chance-san-antonio.json').write_text(json.dumps({'summary':summary,'active':active,'all':clean},indent=2))
              detail=[]
              from concurrent.futures import ThreadPoolExecutor
              from urllib.request import Request,urlopen
              shades=[r for r in active if re.search(r'\b(?:shades?|blinds?)\b',r['product_name'],re.I) and not re.search(r'first aid kit|repair|lampshade',r['product_name'],re.I)]
              allowed={'lot_id','auction_id','lot_number','inventory_id','product_name','title','name','description','product_description','dimension','dimensions','width','height','length','color','colour','upc','asin','model','model_number','manufacturer','brand','condition','stock_image','retail_price','location_id','building_id','is_partial','product_url','amazon_url'}
              def fields(obj,depth=0):
                  if depth>5:return {}
                  out={}
                  if isinstance(obj,dict):
                      for k,v in obj.items():
                          if k.lower() in allowed and isinstance(v,(str,int,float,bool)):
                              out[k]=v[:1800] if isinstance(v,str) else v
                          elif isinstance(v,(dict,list)) and k.lower() in {'lot','item','inventory','product','data','result','details','attributes'}:out.update(fields(v,depth+1))
                  elif isinstance(obj,list) and len(obj)==1:out.update(fields(obj[0],depth+1))
                  return out
              # The public auction page emitted this successful GET natively.
              # Retain native browser transport and do not copy auth or storage.
              for offset in range(0,len(shades),5):
                  pending=[]
                  for row in shades[offset:offset+5]:
                      tab=context.new_page()
                      record={'lot':row['lot_number'],'lot_id':row['lot_id']}
                      expected='/map-bid/ddb/lot/'+str(row['lot_id'])
                      def capture(response,rec=record,target=expected):
                          u=urlsplit(response.url)
                          if u.hostname!='api.macdiscount.com' or u.path!=target:return
                          rec['status']=response.status
                          try:
                              obj=response.json()
                              rec['keys']=list(obj)[:70] if isinstance(obj,dict) else type(obj).__name__
                              rec['fields']=fields(obj)
                              # Preserve safe nested public fields including dimensions and variant labels.
                              def find_public(o,depth=0):
                                  result={}
                                  if depth>6:return result
                                  if isinstance(o,dict):
                                      for k,v in o.items():
                                          if k.lower() in allowed|{'size','item_dimensions','product_dimensions','product_model','product_color','product_upc','model_name','product_id','item_width','item_height','product_details','attributes','specifications'}:
                                              if isinstance(v,(str,int,float,bool)):result[k]=v[:1800] if isinstance(v,str) else v
                                          if isinstance(v,(dict,list)):result.update(find_public(v,depth+1))
                                  elif isinstance(o,list):
                                      for v in o[:15]:result.update(find_public(v,depth+1))
                                  return result
                              rec['public_detail']=find_public(obj)
                          except Exception as e:rec['parse_error']=type(e).__name__
                      tab.on('response',capture)
                      pending.append((tab,row,record))
                  for tab,row,record in pending:
                      try:tab.goto('https://www.mac.bid/auction/'+str(row['auction_id'])+'/lot/'+row['lot_number'],wait_until='commit',timeout=12000)
                      except Exception as e:record['navigation_error']=type(e).__name__
                  for tab,row,record in pending:
                      try:
                          tab.wait_for_timeout(1800)
                          if 'status' not in record:tab.wait_for_timeout(1500)
                          # Public detail page text offers an independent dimension check.
                          t=tab.locator('body').inner_text(timeout=3500)
                          matches={}
                          for label in ['Dimension','Dimensions','UPC','Lot Number','Mac.Bid ID','Condition','Aisle/Section']:
                              m=re.search(re.escape(label)+r':?\s*\n?([^\n]+)',t,re.I)
                              if m:matches[label]=m.group(1).strip()[:150]
                          if matches:record['visible_fields']=matches
                      except Exception as e:record['visible_error']=type(e).__name__
                      detail.append(record)
                      tab.close()
              for d in detail:print('SHADE_DETAIL',json.dumps(d,ensure_ascii=True,separators=(',',':')))
              print('DETAIL_TOTAL',len(detail))
              Path('last-chance-details.json').write_text(json.dumps(detail,indent=2))
              browser.close()
              assert complete,'inventory not proven complete'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: last-chance-san-antonio
          path: |
            last-chance-san-antonio.json
            last-chance-details.json
          if-no-files-found: warn
          retention-days: 2

  regular-auctions:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f286492edc0ac54248e8aca5f3caacfeed48a1a8
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install playwright==1.55.0
          python -m playwright install chromium
          PYTHONPATH=. python scripts/macbid_deal_engine.py
      - name: Summarize public auction candidates
        run: |
          python - <<'PY'
          import json,re,time,datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          d=json.loads(Path('results/macbid-deal-engine.json').read_text())
          print('REGULAR_SCAN',json.dumps(d['scan']))
          now=time.time()
          tz=ZoneInfo('America/Chicago')
          today=datetime.datetime.fromtimestamp(now,tz).date()
          rows=[r for r in d['inventory'] if r.get('auction_location')=='San Antonio' and float(r.get('expected_closing_utc') or 0)>now]
          tonight=[r for r in rows if datetime.datetime.fromtimestamp(float(r['expected_closing_utc']),tz).date()==today]
          print('REGULAR_COUNTS',len(rows),len(tonight))
          keys=['product_name','title','condition','retail_price','current_bid','estimated_post_tax_total','expected_closing_utc','lot_number','auction_number','auction_id','macbid_url','upc','model','unique_bidders','category','deal_score']
          def emit(tag,rs):
              seen=set()
              for r in rs:
                  k=(r.get('upc') or r.get('product_name') or r.get('title'),r.get('lot_number'))
                  if k in seen:continue
                  seen.add(k)
                  print(tag,json.dumps({k:r.get(k) for k in keys},ensure_ascii=True))
          rx=re.compile(r'zigbee|matter|z-wave|homekit|aqara|doorbell|camera|router|wi-fi 6|wifi 6|projector|3d printer|airpods|solar|inverter|power station|ups |battery backup|dishwasher|motorized|motorised|lichtdim|no.drill|tension|smart lock|monitor|tablet|robot vacuum|nugget ice',re.I)
          sorted_rows=sorted(tonight,key=lambda r:float(r.get('deal_score') or 0),reverse=True)
          emit('TONIGHT_DEAL',sorted_rows[:75])
          emit('TECH_DEAL',[r for r in sorted_rows if rx.search(str(r.get('product_name') or r.get('title')) )][:90])
          emit('UPCOMING_DEAL',[r for r in sorted(rows,key=lambda r:(float(r['expected_closing_utc']),-float(r.get('deal_score') or 0))) if r not in tonight and rx.search(str(r.get('product_name') or r.get('title')))][:35])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: regular-auction-inventory
          path: results/macbid-deal-engine.json
          retention-days: 2
