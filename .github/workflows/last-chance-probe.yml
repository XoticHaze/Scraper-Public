name: Last Chance public discovery probe
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/last-chance-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install playwright==1.55.0
          python -m playwright install chromium
      - name: Fetch native San Antonio inventory and verify completeness
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from collections import Counter
          from urllib.parse import urlsplit, parse_qs, urlencode, urlunsplit
          import re
          from playwright.sync_api import sync_playwright
          base='https://api.macdiscount.com'
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              context=browser.new_context(locale='en-US',timezone_id='America/Chicago')
              page=context.new_page()
              native=[]
              def on_response(r):
                  if r.url.startswith(base+'/map-bid/last-chance-deals/search?'):
                      native.append(r.url)
              page.on('response',on_response)
              def select_building(route):
                  u=urlsplit(route.request.url)
                  q=parse_qs(u.query)
                  q['buildings']=['29']
                  route.continue_(url=urlunsplit((u.scheme,u.netloc,u.path,urlencode(q,doseq=True),u.fragment)))
              page.route('**/map-bid/last-chance-deals/search?*',select_building)
              page.goto('https://www.mac.bid/last-chance-deals',wait_until='domcontentloaded',timeout=30000)
              page.wait_for_timeout(5000)
              for label in ['Got it','I understand']:
                  b=page.get_by_role('button',name=label,exact=True)
                  if b.count():
                      try:b.first.click(timeout=3000)
                      except Exception:pass
              page.wait_for_timeout(5000)
              print('AFTER_DISMISS',page.locator('body').inner_text()[:1800])
              print('VISIBLE_LINKS',json.dumps([{'text':a.inner_text()[:100],'href':a.get_attribute('href')} for a in page.locator('a:visible').all()[:30]]))
              def get(path):
                  r=context.request.get(base+path,headers={'Origin':'https://www.mac.bid','Referer':'https://www.mac.bid/'},timeout=30000)
                  print('HTTP',path,r.status)
                  r.raise_for_status() if hasattr(r,'raise_for_status') else None
                  assert r.ok, r.status
                  return r.json()
              buildings=get('/buildings')
              target=[b for b in buildings if b.get('name')=='San Antonio']
              assert len(target)==1 and target[0]['id']==29,target
              data=get('/map-bid/last-chance-deals/search?buildings=29&limit=2000')
              rows=data['items']
              assert isinstance(rows,list)
              now=datetime.now(timezone.utc)
              keys=('id','lot_id','auction_id','inventory_id','lot_number','product_name','stock_image','inventory_images','retail_price','building_id','is_partial','condition','category','price','expires_at','is_sold')
              clean=[{k:r[k] for k in keys if k in r} for r in rows]
              assert all(r.get('building_id')==29 for r in clean)
              assert len({str(r.get('lot_id')) for r in clean})==len(clean)
              complete=data.get('has_more') is False and data.get('count')==len(clean)
              active=[]
              for r in clean:
                  try:
                      expires=datetime.fromisoformat(r['expires_at'].replace('Z','+00:00'))
                      interpretations=[expires] if expires.tzinfo else [expires.replace(tzinfo=timezone.utc),expires.replace(tzinfo=ZoneInfo('America/Chicago'))]
                      future=[x>now for x in interpretations]
                      state='unexpired' if all(future) else 'expired' if not any(future) else 'timezone_uncertain'
                  except (KeyError,ValueError,TypeError,AttributeError):
                      state='invalid_expiry'
                  r['expiry_status']=state
                  if r.get('is_sold')==0 and float(r.get('price',0))==2.99 and state=='unexpired':active.append(r)
              summary={'observed_at':now.isoformat(),'warehouse':'San Antonio','building_id':29,'reported_count':data.get('count'),'received':len(clean),'has_more':data.get('has_more'),'complete':complete,'active':len(active),'expiry_status_counts':dict(Counter(r['expiry_status'] for r in clean)),'expiry_policy':'Conservative: naive values must be future under UTC and America/Chicago; source timezone not established','native_page_observed':bool(native)}
              print('INVENTORY_SUMMARY',json.dumps(summary))
              for r in active:
                  compact={k:v for k,v in r.items() if k not in ('stock_image','inventory_images','inventory_id','id')}
                  print('LOT',json.dumps(compact,ensure_ascii=True,separators=(',',':')))
              Path('last-chance-san-antonio.json').write_text(json.dumps({'summary':summary,'active':active,'all':clean},indent=2))
              detail=[]
              from concurrent.futures import ThreadPoolExecutor
              from urllib.request import Request,urlopen
              shades=[r for r in active if re.search(r'\b(?:shades?|blinds?)\b',r['product_name'],re.I) and not re.search(r'first aid kit|repair|lampshade',r['product_name'],re.I)]
              allowed={'lot_id','auction_id','lot_number','inventory_id','product_name','title','name','description','product_description','dimension','dimensions','width','height','length','color','colour','upc','asin','model','model_number','manufacturer','brand','condition','stock_image','retail_price','location_id','building_id','is_partial','product_url','amazon_url'}
              def fields(obj,depth=0):
                  if depth>5:return {}
                  out={}
                  if isinstance(obj,dict):
                      for k,v in obj.items():
                          if k.lower() in allowed and isinstance(v,(str,int,float,bool)):
                              out[k]=v[:1800] if isinstance(v,str) else v
                          elif isinstance(v,(dict,list)) and k.lower() in {'lot','item','inventory','product','data','result','details','attributes'}:out.update(fields(v,depth+1))
                  elif isinstance(obj,list) and len(obj)==1:out.update(fields(obj[0],depth+1))
                  return out
              def lookup(row):
                  try:
                      url=base+'/map-bid/ddb/lot/'+str(row['lot_id'])
                      req=Request(url,headers={'User-Agent':'Mozilla/5.0','Origin':'https://www.mac.bid','Referer':'https://www.mac.bid/','Accept':'application/json'})
                      with urlopen(req,timeout=12) as resp:
                          obj=json.load(resp)
                          return {'lot':row['lot_number'],'lot_id':row['lot_id'],'status':resp.status,'keys':list(obj)[:70] if isinstance(obj,dict) else type(obj).__name__,'fields':fields(obj)}
                  except Exception as e:return {'lot':row['lot_number'],'lot_id':row['lot_id'],'error':type(e).__name__}
              with ThreadPoolExecutor(max_workers=3) as pool:
                  detail=list(pool.map(lookup,shades))
              for d in detail:print('SHADE_DETAIL',json.dumps(d,ensure_ascii=True,separators=(',',':')))
              print('DETAIL_TOTAL',len(detail))
              Path('last-chance-details.json').write_text(json.dumps(detail,indent=2))
              browser.close()
              assert complete,'inventory not proven complete'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: last-chance-san-antonio
          path: |
            last-chance-san-antonio.json
            last-chance-details.json
          if-no-files-found: warn
          retention-days: 2
