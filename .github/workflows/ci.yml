name: Scraper Public CI

on:
  push:
    paths:
      - 'deal_engine/**'
      - 'config/**'
      - 'scripts/**'
      - 'ui/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'deal_engine/**'
      - 'config/**'
      - 'scripts/**'
      - 'ui/**'
      - 'tests/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: scraper-public-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install test dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest==8.4.1'

      - name: Python compile gate
        run: |
          set -euo pipefail
          python -m compileall -q deal_engine scripts tests

      - name: JavaScript syntax gate
        run: |
          set -euo pipefail
          node --check ui/app.js
          node --check ui/app-enhancements.js
          node --check ui/catalog-loader.js

      - name: Scoring tests
        run: |
          set -euo pipefail
          pytest -q tests/test_deal_scoring.py

      - name: Validate engine policy
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('config/macbid_deal_engine.json').read_text())
          assert cfg['locations'] == ['San Antonio'], cfg['locations']
          assert 'DAMAGED' in cfg['excluded_conditions']
          assert 'LIKE NEW' in cfg['preferred_conditions']
          assert 'OPEN BOX' in cfg['preferred_conditions']
          print('POLICY_GATE=PASS')
          PY
