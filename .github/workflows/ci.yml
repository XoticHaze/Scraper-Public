name: Scraper Public CI

on:
  push:
    paths:
      - 'app/**'
      - 'deal_engine/**'
      - 'vehicle_engine/**'
      - 'encrypted_compute/**'
      - 'producer_worker/**'
      - 'config/**'
      - 'scripts/**'
      - 'tools/**'
      - 'ui/**'
      - 'tests/**'
      - 'docs/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'app/**'
      - 'deal_engine/**'
      - 'vehicle_engine/**'
      - 'encrypted_compute/**'
      - 'producer_worker/**'
      - 'config/**'
      - 'scripts/**'
      - 'tools/**'
      - 'ui/**'
      - 'tests/**'
      - 'docs/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: scraper-public-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install fixed test dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest==8.4.1' 'cryptography==45.0.7'

      - name: Python compile gate
        run: |
          set -euo pipefail
          python -m compileall -q deal_engine vehicle_engine encrypted_compute scripts tools tests

      - name: JavaScript syntax gate
        run: |
          set -euo pipefail
          node --check ui/app.js
          node --check ui/app-enhancements.js
          node --check ui/action-center.js
          node --check ui/catalog-loader.js
          node --check ui/finds.js
          node --check ui/vehicles.js
          node --check producer_worker/index.mjs
          node --check producer_worker/interop.mjs

      - name: Tests
        run: |
          set -euo pipefail
          pytest -q tests/test_deal_scoring.py tests/test_hunts.py tests/test_vehicle_hunt.py tests/test_encrypted_compute.py tests/test_private_producer_interop.py

      - name: Validate engine, app, hunt, locality, privacy, and private-compute policy
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          cfg = json.loads(Path('config/macbid_deal_engine.json').read_text())
          assert cfg['locations'] == ['San Antonio'], cfg['locations']
          assert 'DAMAGED' in cfg['excluded_conditions']
          assert 'LIKE NEW' in cfg['preferred_conditions']
          assert 'OPEN BOX' in cfg['preferred_conditions']
          assert abs(float(cfg['sales_tax_rate']) - 0.0825) < 1e-12
          assert 'San Antonio' in cfg['sales_tax_scope']

          vehicle = json.loads(Path('config/vehicle_hunt.json').read_text())
          assert vehicle['market']['label'].startswith('San Antonio, TX')
          assert vehicle['market']['zip'] == '78237'
          assert vehicle['market']['preferred_radius_miles'] == 50
          assert vehicle['market']['hard_radius_miles'] == 200
          assert vehicle['market']['priority_area_weights']['kelly_inner_west'] > vehicle['market']['priority_area_weights']['san_antonio_other']
          assert vehicle['vehicle']['target_price'] == 23000
          assert vehicle['vehicle']['maintenance_control_mileage'] == 35000
          assert abs(float(vehicle['ownership_cost']['sales_tax_rate']) - 0.0625) < 1e-12
          assert any(row['id'] == 'north_park_toyota' and row['area_priority'] == 'kelly_inner_west' for row in vehicle['source']['local_dealers'])
          assert any(row['kind'] == 'autotrader' and row['enabled'] for row in vehicle['source']['aggregators'])
          assert all('78237' in row['url'] for row in vehicle['source']['discovery_routes'] if row['id'] in {'autotrader_inner_west_sa','kbb_inner_west_sa','autotrader_sa_rav4_awd'})

          manifest = json.loads(Path('app/actions.json').read_text())
          assert manifest['schema'] == 'repo-app-actions-v1'
          assert manifest['repository'] == 'XoticHaze/Scraper-Public'
          ids = {action['id'] for action in manifest['actions']}
          assert {'refresh', 'visual-review', 'actions', 'source'} <= ids
          for action in manifest['actions']:
              assert action.get('fallback_url', '').startswith('https://github.com/XoticHaze/Scraper-Public')

          hunts = json.loads(Path('app/hunts.json').read_text())
          assert hunts['schema'] == 'macbid-hunt-profiles-v1'
          hunt_ids = {profile['id'] for profile in hunts['profiles']}
          assert {
              '4k-projectors', 'large-gaming-monitors', 'quality-speakers',
              'solar-panels', 'ptz-cameras-haos', 'smart-door-locks-haos',
              'large-area-rugs', 'tools', 'samsung-tablets', 'apple-devices',
              'best-tech-deals', 'resale-watch'
          } <= hunt_ids
          for profile in hunts['profiles']:
              assert profile.get('verification'), profile['id']

          assert Path('ui/finds.html').exists()
          assert Path('ui/finds.js').exists()
          assert Path('ui/finds.css').exists()
          assert Path('ui/vehicles.html').exists()
          assert Path('ui/vehicles.js').exists()
          assert Path('ui/vehicles.css').exists()
          assert 'href="vehicles.html"' in Path('ui/index.html').read_text()
          assert Path('producer_worker/index.mjs').exists()
          assert Path('docs/PRIVACY_BOUNDARY.md').exists()
          assert Path('.github/workflows/encrypted-private-compute-runtime.yml').exists()

          finds_html = Path('ui/finds.html').read_text()
          assert 'stays only in this browser/device' in finds_html
          app_js = Path('ui/app.js').read_text()
          assert "localStorage.getItem('macbid-hunt-watchlist')" in app_js
          assert "localStorage.setItem('macbid-hunt-watchlist'" in app_js
          assert 'estimated_post_tax_total' in app_js
          assert 'Estimated all-in total' in app_js
          assert 'estimated_post_tax_total' in Path('ui/finds.js').read_text()
          vehicle_js = Path('ui/vehicles.js').read_text()
          assert 'vehicle_catalog.json' in vehicle_js
          assert 'discovery_routes' in vehicle_js
          assert 'source_registry' in vehicle_js

          producer_js = Path('producer_worker/index.mjs').read_text()
          assert '/v1/private-compute/notify' not in producer_js
          assert "mode: 'cron-only'" in producer_js
          assert "actions: 'read'" in producer_js
          assert 'trusted_runtime_not_attested' in producer_js
          assert "repo-app-private-compute-request-v2" in producer_js

          caller = Path('.github/workflows/encrypted-private-compute.yml').read_text()
          runtime = Path('.github/workflows/encrypted-private-compute-runtime.yml').read_text()
          trusted_runtime_sha = '646afc3a233f8a9739b252925d94592b30fea470'
          trusted_source_sha = 'c09bac2079895d3f41cb346d2a9adf67369f0fb9'
          assert f'encrypted-private-compute-runtime.yml@{trusted_runtime_sha}' in caller
          assert trusted_source_sha in runtime
          assert 'Checkout pinned public execution source' in runtime

          contracts = json.loads(Path('config/encrypted_compute_contracts.json').read_text())
          assert contracts['schema'] == 'repo-app-encrypted-compute-contracts-v1'
          private = contracts['contracts']['python-bundle-v1']
          assert private['entrypoint'] == 'entrypoint.py'
          assert private['authority'] == 'private_compute_only'
          assert private['timeout_seconds'] <= 600
          print('POLICY_GATE=PASS')
          PY
