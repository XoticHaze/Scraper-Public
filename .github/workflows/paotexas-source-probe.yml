name: Auctioneer Store Source Truth Probe

on:
  workflow_dispatch:
  push:
    branches:
      - probe/paotexas-first-party-20261018
    paths:
      - 'tools/paotexas_source_probe.py'
      - '.github/workflows/paotexas-source-probe.yml'

permissions:
  contents: read

jobs:
  first-party-source-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Probe only auctioneer-owned public storefront
        run: python tools/paotexas_source_probe.py
