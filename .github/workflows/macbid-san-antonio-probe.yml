name: MAC.BID San Antonio Public Probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/macbid_probe.py'
      - 'scripts/macbid_search_discovery.py'
      - 'scripts/macbid_location_discovery.py'
      - '.github/workflows/macbid-san-antonio-probe.yml'

permissions:
  contents: read

# Public-target probe only. Never add cookies, auth headers, browser storage,
# account state, or non-public payloads to this direct workflow.
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install fixed browser dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          python -m playwright install --with-deps chromium

      - name: Probe public MAC.BID network surface
        run: |
          set -euo pipefail
          python scripts/macbid_probe.py

      - name: Discover San Antonio location filters
        run: |
          set -euo pipefail
          python scripts/macbid_location_discovery.py

      - name: Discover live search routing and lot cards
        run: |
          set -euo pipefail
          python scripts/macbid_search_discovery.py

      - name: Show sanitized reports
        if: always()
        run: |
          set -euo pipefail
          for report in results/*.json; do
            [ -f "$report" ] || continue
            echo "===== $report ====="
            python -m json.tool "$report"
          done

      - name: Upload sanitized discovery reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macbid-sanitized-discovery
          path: results/*.json
          if-no-files-found: warn
          retention-days: 3
