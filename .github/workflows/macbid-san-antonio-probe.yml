name: MAC.BID San Antonio Public Probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/macbid_probe.py'
      - '.github/workflows/macbid-san-antonio-probe.yml'

permissions:
  contents: read

# Public-target probe only. Never add cookies, auth headers, browser storage,
# account state, or non-public payloads to this direct workflow.
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install fixed browser dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          python -m playwright install --with-deps chromium

      - name: Probe public MAC.BID network surface
        run: |
          set -euo pipefail
          python scripts/macbid_probe.py

      - name: Show sanitized report
        if: always()
        run: |
          set -euo pipefail
          if [ -f results/macbid-san-antonio-probe.json ]; then
            python -m json.tool results/macbid-san-antonio-probe.json
          else
            echo 'No report file was produced.'
          fi
