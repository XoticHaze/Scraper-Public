name: GSA Official API Source Probe
on:
  workflow_dispatch:
    inputs:
      run_demo_probe:
        description: Run one documented public GSA DEMO_KEY probe
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gsa-api-probe:
    # Public demo is manual-only to respect shared limits.
    if: ${{ inputs.run_demo_probe == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout pinned trigger revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Execute one read-only official GSA probe
        run: |
          python -m scripts.gsa_public_scan --demo-probe
