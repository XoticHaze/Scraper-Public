name: MAC.BID Lot State Probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/macbid_lot_state_probe.py'
      - '.github/workflows/macbid-lot-state-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Probe public live lot state
        run: |
          set -euo pipefail
          python scripts/macbid_lot_state_probe.py
