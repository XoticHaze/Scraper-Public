name: MAC.BID San Antonio Direct Hunt

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/macbid_direct_hunt.py'
      - '.github/workflows/macbid-direct-hunt.yml'

permissions:
  contents: read

jobs:
  hunt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install browser
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Replay public San Antonio search contract
        run: |
          set -euo pipefail
          python scripts/macbid_direct_hunt.py
      - name: Show sanitized report
        if: always()
        run: |
          set -euo pipefail
          [ ! -f results/macbid-direct-hunt.json ] || python -m json.tool results/macbid-direct-hunt.json
      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macbid-direct-hunt
          path: results/macbid-direct-hunt.json
          if-no-files-found: warn
          retention-days: 2
