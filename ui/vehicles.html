<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vehicle Hunt</title>
  <link rel="stylesheet" href="vehicles.css" />
</head>
<body>
  <header>
    <p>SAN ANTONIO · LOCAL VEHICLE DEAL ENGINE</p>
    <h1>Vehicle Hunt</h1>
    <p id="meta">Loading latest scan…</p>
    <a href="index.html">MAC.BID Hunt</a>
  </header>
  <main>
    <section class="controls">
      <label>Max price <input id="max-price" type="number" value="27000" /></label>
      <label>Max mileage <input id="max-mileage" type="number" value="100000" /></label>
      <label>Max distance <input id="max-distance" type="number" value="200" /></label>
      <label><input id="awd" type="checkbox" /> AWD only</label>
      <label><input id="local" type="checkbox" /> local / nearby only</label>
    </section>
    <section class="source-panel">
      <h2>Coverage</h2>
      <p id="source-status">Loading source health…</p>
      <div id="source-links" class="route-links"></div>
      <h3>Broaden / verify the market</h3>
      <div id="discovery-links" class="route-links"></div>
    </section>
    <p><strong id="count">0</strong> matching vehicles</p>
    <section id="grid" class="grid"></section>
  </main>
  <script src="vehicles.js" defer></script>
</body>
</html>
